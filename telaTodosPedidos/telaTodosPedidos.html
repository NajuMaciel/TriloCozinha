<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trilo - Todos os Pedidos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Estilos base (fundo, logo, pontinhos) vêm da tela inicial -->
  <link rel="stylesheet" href="telaInicial.css">
  <link rel="stylesheet" href="telaTodosPedidos.css">
</head>
<body>

  <main class="tela">

    <!-- Formas decorativas do fundo -->
    <div class="fundo" aria-hidden="true">
      <span class="onda onda-1"></span>
      <span class="onda onda-2"></span>
      <span class="onda onda-3"></span>
    </div>

    <!-- Topo: logo + 3 pontinhos (voltam para a tela inicial) -->
    <header class="topo">
      <img id="logo" class="logo" src="img/logo-trilo.png" alt="Trilo">

      <button id="botaoMenu" class="botao-menu" type="button" aria-label="Voltar para a tela inicial">
        <span class="ponto"></span>
        <span class="ponto"></span>
        <span class="ponto"></span>
      </button>
    </header>

    <section class="atendimento">
      <h1 class="titulo">Todos os Pedidos Entregues</h1>
      <p id="contador" class="contador"></p>
      <ul id="listaTodos" class="lista-pedidos lista-todos"></ul>
    </section>

    <button id="botaoVoltarLateral" class="botao-voltar" type="button">&larr; Voltar</button>

  </main>

  <script src="pedidos.js"></script>
  <script src="telaTodosPedidos.js"></script>
</body>
</html>
