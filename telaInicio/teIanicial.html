<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trilo - Em Atendimento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="telaInicial.css">
  <link rel="stylesheet" href="modal.css">
</head>

<body>

  <main class="tela">

    <!-- Formas decorativas do fundo -->
    <div class="fundo" aria-hidden="true">
      <img src="/public/images/onda.svg" alt="" class="imagem-fundo-inferior">
      <img src="/public/images/ellipse-5.svg" alt="" class="imagem-fundo-superior">
      <img src="/public/images/ellipse-3.svg" alt="" class="imagem-fundo-meio">
    </div>

    <!-- Topo: logo + botão dos 3 pontinhos (abre o modal) -->
    <header class="topo">
      <img id="logo" class="logo" src="/public/images/logo.svg" alt="Trilo">

      <button id="botaoMenu" class="botao-menu" type="button"
              aria-label="Abrir pedidos entregues"
              aria-haspopup="dialog" aria-expanded="false" aria-controls="modalEntregues">
        <span class="ponto"></span>
        <span class="ponto"></span>
        <span class="ponto"></span>
      </button>
    </header>

    <!-- Lista de pedidos em atendimento -->
    <section class="atendimento">
      <h1 class="titulo">Em Atendimento</h1>
      <ul id="listaPedidos" class="lista-pedidos"></ul>
    </section>

    <!-- ===== MODAL: Pedidos Entregues ===== -->
    <!-- Cortina: clicar fora do painel fecha o modal -->
    <div id="cortina" class="cortina" hidden></div>

    <aside id="modalEntregues" class="modal-painel" role="dialog"
           aria-modal="true" aria-labelledby="modalTitulo" aria-hidden="true">

      <!-- 3 pontinhos: fecham o modal -->
      <button id="botaoFecharModal" class="botao-menu botao-menu--modal" type="button"
              aria-label="Fechar pedidos entregues">
        <span class="ponto"></span>
        <span class="ponto"></span>
        <span class="ponto"></span>
      </button>

      <h2 id="modalTitulo" class="painel-titulo">Pedidos Entregues</h2>

      <ul id="listaEntregues" class="lista-entregues"></ul>

      <div class="painel-rodape">
        <a href="../telaPedidos/telaPedidos.html" class="link-historico">Ver todos pedidos</a>
        <a href="../telaCadastro/telaCadastro.html" class="botao-cadastrar">Cadastrar</a>
      </div>
    </aside>

  </main>

  <script src="telaInicial.js"></script>
  <script src="modal.js"></script>
</body>

</html>
