<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trilo - Em Atendimento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="telaInicial.css" >
</head>
<body>

  <main class="tela">

    <!-- Formas decorativas do fundo -->
    <div class="fundo" aria-hidden="true">
      <img src="/public/images/onda.svg" alt="" class="imagem-fundo">
      <span class="onda onda-1"></span>
      <span class="onda onda-2"></span>
      <span class="onda onda-3"></span>
    </div>

    <!-- Topo: logo + botão dos 3 pontinhos -->
    <header class="topo">
      <!-- Coloque o arquivo da logo em img/logo-trilo.png (ou ajuste o caminho abaixo) -->
      <img id="logo" class="logo" src="/public/images/logo.svg" alt="Trilo">

      <button id="botaoMenu" class="botao-menu" type="button" aria-label="Abrir menu lateral">
        <span class="ponto"></span>
        <span class="ponto"></span>
        <span class="ponto"></span>
      </button>
    </header>

    <!-- Lista de pedidos em atendimento -->
    <section class="atendimento">
      <h1 class="titulo">Em Atendimento</h1>
      <ul id="listaPedidos" class="lista-pedidos"></ul>
    </section>

  </main>

  <script src="telaInicial.js"></script>
</body>
</html>
